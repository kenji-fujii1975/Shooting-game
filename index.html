<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rocket Shooter – Full Starfield & Sprites (Stable)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#e2e8f0;font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP",sans-serif}
    canvas{width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;gap:8px;padding:8px 12px;pointer-events:none;z-index:5}
    .badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
    .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);z-index:10}
    .card{background:rgba(14,18,30,.9);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,.15);width:min(92vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .card h1{margin:6px 0 12px;font-size:clamp(20px,5vw,28px)}
    .btn{appearance:none;border:none;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;color:#0b0f1a;background:#5eead4;box-shadow:0 4px 14px rgba(0,0,0,.25), inset 0 -2px 0 rgba(0,0,0,.25)}
    .hint{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom);color:#cbd5e1;text-align:center;padding:10px;font-size:12px;opacity:.85;z-index:5}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="badge" id="score">SCORE 0000</div>
    <div class="badge" id="best">BEST 0000</div>
    <div class="badge" id="bossBadge" style="display:none">BOSS 100</div>
  </div>
  <div class="hint">画面を指でなぞって自機を移動（オートショット）</div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>🚀 Rocket Shooter</h1>
      <p>星空を駆け抜けてUFOを撃墜！<br>雑魚<strong>30機</strong>で<strong>ボス戦艦</strong>出現。BGMは通常/ボスで切替。</p>
      <ul style="margin:0 0 12px 1.2em; color:#c7d2fe; line-height:1.7">
        <li>オートショット（基本 250ms / 連射アイテムで短縮）</li>
        <li>アイテム：<strong>3</strong>(3方向) / <strong>V</strong>(2耐久バリア) / <strong>R</strong>(連射強化)</li>
      </ul>
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>

<script>
(function(){
  // ===== quick sanity =====
  (function(){var ids=['game','score','best','bossBadge','menu','startBtn'];var miss=ids.filter(id=>!document.getElementById(id));console.assert(miss.length===0,'Missing DOM:',miss);})();

  // ===== Canvas & DPR =====
  var cv=document.getElementById('game'), ctx=cv.getContext('2d');
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){var w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);} resize();
  addEventListener('resize', resize, {passive:true});

  // ===== Starfield (center-origin so it covers entire screen) =====
  var stars=[]; function initStars(){ var N=180; stars.length=0; for(var i=0;i<N;i++){ stars.push({ x:(Math.random()*2-1)*(innerWidth/2), y:(Math.random()*2-1)*(innerHeight/2), z:Math.random()*innerWidth }); } }
  initStars();
  function drawStars(dt){ ctx.fillStyle='#000'; ctx.fillRect(0,0,innerWidth,innerHeight); var speed=0.24; for(var i=0;i<stars.length;i++){ var s=stars[i]; s.z-=dt*speed; if(s.z<=0){ s.z=innerWidth; s.x=(Math.random()*2-1)*(innerWidth/2); s.y=(Math.random()*2-1)*(innerHeight/2); } var k=128/s.z; var px=s.x*k+innerWidth/2; var py=s.y*k+innerHeight/2; if(px>=-2&&px<=innerWidth+2&&py>=-2&&py<=innerHeight+2){ var size=(1-s.z/innerWidth)*2.5+0.5; ctx.fillStyle='#fff'; ctx.fillRect(px,py,size,size); } } }

  // ===== State =====
  var state={ running:false,last:0,score:0,best:parseInt(localStorage.getItem('rs_best')||'0',10),
    player:{x:0.5,y:0.82,tx:0.5,ty:0.82,r:18,fireAcc:0,fireRate:250},
    bullets:[], enemies:[], spawnAcc:0, explosions:[], items:[],
    boss:null, bossShots:[],
    freeze:false, clearTimer:0, clearShown:false,
    dieFreeze:false, dieTimer:0, dieShown:false,
    power:{triple:false, rapid:false, shield:0}
  };
  var scoreEl=document.getElementById('score');
  var bestEl=document.getElementById('best'); bestEl.textContent='BEST '+String(state.best).padStart(4,'0');
  var bossBadge=document.getElementById('bossBadge');
  var menu=document.getElementById('menu');

  // ===== BGM (synth) =====
  var audioCtx=null, masterGain=null, bgmTimerId=null, currentBgm='none';
  function initAudio(){ try{ if(audioCtx) return; audioCtx=new (window.AudioContext||window.webkitAudioContext)(); masterGain=audioCtx.createGain(); masterGain.gain.value=0.32; masterGain.connect(audioCtx.destination); if(audioCtx.state==='suspended' && audioCtx.resume) audioCtx.resume(); }catch(e){ console.warn(e); }}
  function tone(freq,dur,type,vol,when){ if(!audioCtx) return; try{ var osc=audioCtx.createOscillator(); var g=audioCtx.createGain(); osc.type=type; osc.frequency.value=freq; g.gain.value=vol; osc.connect(g).connect(masterGain); var t=when||audioCtx.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); osc.start(t); osc.stop(t+dur); }catch(e){} }
  function stopBGM(){ if(bgmTimerId){ clearTimeout(bgmTimerId); bgmTimerId=null; } }
  function startBGM(mode){ if(!audioCtx) return; try{ audioCtx.resume&&audioCtx.resume(); }catch(_){} stopBGM(); currentBgm=mode||'normal'; var tempo=(currentBgm==='boss')?220:180; var beat=60/tempo; var chords=(currentBgm==='boss')? [[110,147,220],[98,130,196],[123,164,220],[147,196,247]] : [[262,330,392],[220,294,392],[247,330,415],[220,294,392]]; function loop(){ if(!audioCtx) return; var now=audioCtx.currentTime+0.05; for(var bar=0; bar<4; bar++){ var t0=now+bar*4*beat, ch=chords[bar%4]; for(var s=0;s<4;s++){ tone(55,0.06,'square',0.13, t0 + s*beat); } tone(ch[0]/2,0.18,'triangle',0.10, t0); tone(ch[0]/2,0.18,'triangle',0.10, t0+2*beat); for(var hh=0; hh<8; hh++){ tone(9000,0.02,'square',0.03, t0 + hh*(beat/2)); } for(var i=0;i<16;i++){ var f=ch[i%3]*(currentBgm==='boss'?2.8:2.2); tone(f,0.09,'square', currentBgm==='boss'?0.085:0.06, t0 + i*(beat/4)); } } bgmTimerId=setTimeout(loop, (16*beat*1000)|0); } loop(); }

  // ===== SFX (MP3) with pooling & iOS unlock =====
  var sfx={}, sfxLoaded=false, audioUnlocked=false;
  function loadSfx(name, src, voices){ sfx[name]={pool:[], idx:0}; for(var i=0;i<voices;i++){ var a=new Audio(src); a.preload='auto'; a.crossOrigin='anonymous'; try{ a.load(); }catch(_){ } sfx[name].pool.push(a); } }
  function setupSfx(){ if(sfxLoaded) return; loadSfx('shot','shot.mp3',6); loadSfx('bakuha','bakuha.mp3',6); sfxLoaded=true; }
  function playSfx(name, vol, rate){ var e=sfx[name]; if(!e||e.pool.length===0) return; var a=e.pool[e.idx++ % e.pool.length]; try{ a.pause(); a.currentTime=0; if(typeof vol==='number') a.volume=vol; if(typeof rate==='number') a.playbackRate=rate; a.play().catch(function(){}); }catch(_){} }
  function unlockAudioOnce(){ if(audioUnlocked) return; audioUnlocked=true; try{ if(!audioCtx) initAudio(); if(audioCtx){ var b=audioCtx.createBuffer(1,1,22050); var src=audioCtx.createBufferSource(); src.buffer=b; src.connect(masterGain); src.start(0); }
    setupSfx(); Object.keys(sfx).forEach(function(k){ var a=sfx[k].pool[0]; try{ a.muted=true; a.play().then(function(){ a.pause(); a.currentTime=0; a.muted=false; }).catch(function(){}); }catch(_){ } });
  }catch(_){ }
  }
  function sfxShoot(){ setupSfx(); playSfx('shot', 0.85, 1.0); }
  function sfxExplode(){ setupSfx(); playSfx('bakuha', 0.9, 1.0); }

  // ===== Assets =====
  var bossImg=new Image(); var bossReady=false; bossImg.onload=function(){ bossReady=true; }; bossImg.onerror=function(){ console.warn('boss.png not found; fallback boss'); bossReady=false; }; bossImg.src='boss.png';
  var playerImg=new Image(); var playerReady=false; playerImg.onload=function(){ playerReady=true; }; playerImg.onerror=function(){ console.warn('player.png not found; fallback rocket'); playerReady=false; }; playerImg.src='player.png';
  var enemyImg=new Image(); var enemyReady=false; enemyImg.onload=function(){ enemyReady=true; }; enemyImg.onerror=function(){ console.warn('enemy.png not found; fallback UFO'); enemyReady=false; }; enemyImg.src='enemy.png';

  // ===== Input: finger-follow =====
  var dragging=false; function setTarget(e){ var t=e.touches?e.touches[0]:e; var r=cv.getBoundingClientRect(); var nx=(t.clientX-r.left)/r.width; var ny=(t.clientY-r.top)/r.height; state.player.tx=Math.max(0.05,Math.min(0.95,nx)); state.player.ty=Math.max(0.10,Math.min(0.95,ny)); }
  cv.addEventListener('pointerdown',function(e){dragging=true;setTarget(e);if(!audioCtx) initAudio(); unlockAudioOnce();});
  cv.addEventListener('pointermove',function(e){if(dragging) setTarget(e);});
  addEventListener('pointerup',function(){dragging=false;});
  cv.addEventListener('touchstart',function(e){dragging=true;setTarget(e);if(!audioCtx) initAudio(); unlockAudioOnce();},{passive:false});
  cv.addEventListener('touchmove',function(e){if(dragging) setTarget(e);},{passive:false});
  cv.addEventListener('touchend',function(){dragging=false;});
  cv.addEventListener('touchcancel',function(){dragging=false;});

  // ===== Helpers / Drawing =====
  function rand(a,b){return a+Math.random()*(b-a);} function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function drawPlayer(){ var x=state.player.x*innerWidth, y=state.player.y*innerHeight, r=state.player.r; if(playerReady){ var asp=playerImg.width && playerImg.height ? (playerImg.width/playerImg.height) : 1; var h=Math.min(innerHeight, innerWidth)*0.1; var w=h*asp; ctx.save(); ctx.translate(x,y); ctx.drawImage(playerImg,-w/2,-h/2,w,h); if(state.power.shield>0){ ctx.strokeStyle='rgba(147,197,253,0.6)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,Math.max(w,h)*0.6,0,Math.PI*2); ctx.stroke(); } ctx.restore(); } else { ctx.save(); ctx.translate(x,y); var fl=Math.sin(performance.now()/50)*2+6; ctx.fillStyle='#f97316'; ctx.beginPath(); ctx.moveTo(0,r+2); ctx.lineTo(-4,r+2+fl); ctx.lineTo(4,r+2+fl); ctx.closePath(); ctx.fill(); ctx.fillStyle='#e5e7eb'; ctx.beginPath(); ctx.moveTo(0,-r); ctx.quadraticCurveTo(r*0.6,-r*0.1,r*0.55,r*0.75); ctx.lineTo(-r*0.55,r*0.75); ctx.quadraticCurveTo(-r*0.6,-r*0.1,0,-r); ctx.fill(); ctx.fillStyle='#38bdf8'; ctx.beginPath(); ctx.arc(0,-r*0.2,r*0.35,0,Math.PI*2); ctx.fill(); if(state.power.shield>0){ ctx.strokeStyle='rgba(147,197,253,0.6)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.stroke(); } ctx.restore(); } }
  function drawEnemy(e){ ctx.save(); ctx.translate(e.x,e.y); if(enemyReady){ var w=e.w||Math.max(28,(e.r||20)*2), h=e.h||Math.max(20,(e.r||20)*2); ctx.drawImage(enemyImg,-w/2,-h/2,w,h); } else { ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.arc(0,0,(e.r||14),0,Math.PI*2); ctx.fill(); } ctx.restore(); }
  function drawBoss(B){ ctx.save(); ctx.translate(B.x,B.y); if(bossReady){ ctx.drawImage(bossImg,-B.w/2,-B.h/2,B.w,B.h); } else { ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.ellipse(0,0,B.w*0.45,B.h*0.25,0,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
  function drawItem(it){ ctx.save(); ctx.translate(it.x,it.y); ctx.fillStyle='#fef08a'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#0b0f1a'; ctx.font='700 14px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(it.type,0,1); ctx.restore(); }
  function createExplosion(x,y,strong){ var n=strong?40:18, parts=[]; for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2, sp=rand(80, strong?320:240); parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:i%2?'#fde047':'#f97316'});} state.explosions.push({parts:parts,age:0,life: strong?700:500}); }

  // ===== Spawners =====
  function spawnEnemy(){ var x=rand(0.1,0.9)*innerWidth; var vy=rand(80,120); if(enemyReady && enemyImg.width>0 && enemyImg.height>0){ var aspect=enemyImg.width/enemyImg.height; var h=Math.min(innerHeight*0.09,90); var w=Math.max(28,h*aspect); var r=Math.max(w,h)*0.28; state.enemies.push({x:x,y:-20,vy:vy,w:w,h:h,r:r}); } else { state.enemies.push({x:x,y:-20,r:14,vy:vy}); } }
  function maybeSpawnItem(x,y){ if(Math.random()<0.1){ var types=['3','V','R']; var t=types[(Math.random()*3)|0]; state.items.push({x:x,y:y,type:t,vy:80}); } }

  // ===== Update =====
  function update(dt){
    if(state.freeze && state.clearTimer>0){ state.clearTimer-=dt; updateExplosions(dt); if(state.clearTimer<=0 && !state.clearShown){ state.clearShown=true; showClearOverlay(); } return; }
    if(state.dieFreeze && state.dieTimer>0){ state.dieTimer-=dt; updateExplosions(dt); if(state.dieTimer<=0 && !state.dieShown){ state.dieShown=true; showGameOverOverlay(); } return; }

    var s=1-Math.exp(-10*dt/1000); state.player.x += (state.player.tx-state.player.x)*s; state.player.y += (state.player.ty-state.player.y)*s; state.player.x=clamp(state.player.x,0.05,0.95); state.player.y=clamp(state.player.y,0.10,0.95);

    state.player.fireAcc += dt; var rate = state.power.rapid ? state.player.fireRate/2 : state.player.fireRate; while(state.player.fireAcc>=rate){ state.player.fireAcc-=rate; var px=state.player.x*innerWidth, py=state.player.y*innerHeight - state.player.r; sfxShoot(); if(state.power.triple){ var spread=[-0.15,0,0.15]; for(var i=0;i<spread.length;i++){ var ang=spread[i]; state.bullets.push({x:px,y:py,vx:400*Math.sin(ang),vy:-400*Math.cos(ang)}); } } else { state.bullets.push({x:px,y:py,vx:0,vy:-400}); } }

    for(var i=state.bullets.length-1;i>=0;i--){ var b=state.bullets[i]; b.x+=b.vx*dt/1000; b.y+=b.vy*dt/1000; if(b.y<-30||b.y>innerHeight+30||b.x<-30||b.x>innerWidth+30) state.bullets.splice(i,1); }

    state.spawnAcc += dt; while(state.spawnAcc>=700){ state.spawnAcc-=700; spawnEnemy(); }
    for(var e=0;e<state.enemies.length;e++){ state.enemies[e].y += state.enemies[e].vy*dt/1000; }
    state.enemies = state.enemies.filter(function(e){ return e.y<innerHeight+40; });

    outer: for(var ei=state.enemies.length-1; ei>=0; ei--){ var E=state.enemies[ei]; for(var bj=state.bullets.length-1; bj>=0; bj--){ var BB=state.bullets[bj]; var dx=BB.x-E.x, dy=BB.y-E.y; if(dx*dx+dy*dy <= E.r*E.r){ state.enemies.splice(ei,1); state.bullets.splice(bj,1); state.score++; scoreEl.textContent='SCORE '+String(state.score).padStart(4,'0'); sfxExplode(); createExplosion(E.x,E.y,false); maybeSpawnItem(E.x,E.y); break outer; } } }

    if(!state.boss && state.score>=30){ var aspect=(bossReady && bossImg.height)?(bossImg.width/bossImg.height):0.5; var bh=Math.min(innerHeight*0.55,700); var bw=Math.max(120,bh*aspect); var maxAmp=Math.max(40,(innerWidth-bw)/2-16); var amp=Math.min(maxAmp,Math.max(60,innerWidth*0.12)); state.boss={x:innerWidth/2,y:innerHeight*0.22,w:bw,h:bh,hp:100,t:0,cx:innerWidth/2,amp:amp,fireAcc:0}; bossBadge.style.display='inline-block'; bossBadge.textContent='BOSS '+state.boss.hp; startBGM('boss'); }

    if(state.boss){ var B=state.boss; B.t+=dt/1000; B.x=Math.max(B.w*0.5+12, Math.min(innerWidth-B.w*0.5-12, B.cx + B.amp*Math.sin(B.t*1.6)));
      B.fireAcc += dt; while(B.fireAcc>=300){ B.fireAcc-=300; var px2=state.player.x*innerWidth, py2=state.player.y*innerHeight; var sx=B.x, sy=B.y+B.h*0.1; var base=Math.atan2(py2-sy,px2-sx); var spd=300; for(var n=-1;n<=1;n++){ var a=base+n*0.1; state.bossShots.push({x:sx,y:sy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:4}); } }
      for(var k=state.bullets.length-1;k>=0;k--){ var sb=state.bullets[k]; if(sb.x>=B.x-B.w/2 && sb.x<=B.x+B.w/2 && sb.y>=B.y-B.h/2 && sb.y<=B.y+B.h/2){ state.bullets.splice(k,1); if(B.hp>0){ B.hp--; bossBadge.textContent='BOSS '+B.hp; sfxExplode(); createExplosion(sb.x,sb.y,true); if(B.hp<=0){ bossBadge.style.display='none'; for(var t=0;t<10;t++){ createExplosion(B.x+rand(-30,30),B.y+rand(-20,20),true);} return gameClear(B.x,B.y); } } } }
      var pxp=state.player.x*innerWidth, pyp=state.player.y*innerHeight, pr=state.player.r; var inX=pxp+pr>B.x-B.w/2 && pxp-pr<B.x+B.w/2; var inY=pyp+pr>B.y-B.h/2 && pyp-pr<B.y+B.h/2; if(inX&&inY){ if(state.power.shield>0){ state.power.shield--; } else { sfxExplode(); createExplosion(pxp,pyp,true); return triggerDeath(); } }
    }

    if(state.bossShots.length){ var psx=state.player.x*innerWidth, psy=state.player.y*innerHeight, pr2=state.player.r; for(var bs=state.bossShots.length-1; bs>=0; bs--){ var sh=state.bossShots[bs]; sh.x+=sh.vx*dt/1000; sh.y+=sh.vy*dt/1000; if(sh.x<-20||sh.x>innerWidth+20||sh.y<-40||sh.y>innerHeight+40){ state.bossShots.splice(bs,1); continue; } var dxs=psx-sh.x, dys=psy-sh.y; if(dxs*dxs+dys*dys <= (pr2+sh.r)*(pr2+sh.r)){ if(state.power.shield>0){ state.power.shield--; state.bossShots.splice(bs,1); continue; } sfxExplode(); createExplosion(psx,psy,true); return triggerDeath(); } } }

    var pxe=state.player.x*innerWidth, pye=state.player.y*innerHeight, pre=state.player.r; for(var m=state.enemies.length-1;m>=0;m--){ var e2=state.enemies[m]; var dxe=pxe-e2.x, dye=pye-e2.y; if(dxe*dxe + dye*dye <= (pre+e2.r)*(pre+e2.r)){ if(state.power.shield>0){ state.power.shield--; state.enemies.splice(m,1); continue; } sfxExplode(); createExplosion(pxe,pye,true); return triggerDeath(); } }

    for(var it=state.items.length-1; it>=0; it--){ var I=state.items[it]; I.y += I.vy*dt/1000; if(I.y>innerHeight+20){ state.items.splice(it,1); continue; } if(Math.abs(I.x - pxe)<20 && Math.abs(I.y - pye)<20){ var ttype=I.type; state.items.splice(it,1); if(ttype==='3') state.power.triple=true; else if(ttype==='V') state.power.shield=2; else if(ttype==='R') state.power.rapid=true; } }

    updateExplosions(dt);
  }
  function updateExplosions(dt){ for(var q=state.explosions.length-1;q>=0;q--){ var ex=state.explosions[q]; ex.age+=dt; var damp=0.98; for(var p=0;p<ex.parts.length;p++){ var prt=ex.parts[p]; prt.x+=prt.vx*dt/1000; prt.y+=prt.vy*dt/1000; prt.vx*=damp; prt.vy*=damp; prt.vy+=80*dt/1000; } if(ex.age>(ex.life||600)) state.explosions.splice(q,1); } }

  // ===== Draw =====
  function draw(){ var now=performance.now(); var dt=(state.last? now-state.last : 16); state.last=now; drawStars(dt); for(var i=0;i<state.enemies.length;i++) drawEnemy(state.enemies[i]); if(state.boss) drawBoss(state.boss); ctx.fillStyle='#fde047'; for(var b=0;b<state.bullets.length;b++){ var bb=state.bullets[b]; ctx.fillRect(bb.x-2,bb.y-8,4,8); } ctx.fillStyle='#ef4444'; for(var s=0;s<state.bossShots.length;s++){ var sh=state.bossShots[s]; ctx.beginPath(); ctx.arc(sh.x,sh.y,sh.r,0,Math.PI*2); ctx.fill(); } for(var it=0; it<state.items.length; it++) drawItem(state.items[it]); drawPlayer(); for(var e=0; e<state.explosions.length; e++){ var ex=state.explosions[e]; for(var p=0;p<ex.parts.length;p++){ var part=ex.parts[p]; ctx.fillStyle=part.color; ctx.fillRect(part.x-1,part.y-1,2,2); } } }

  // ===== Loop =====
  function loop(){ if(!state.running) return; var now=performance.now(); var dt=state._last? (now-state._last):16; if(dt>80) dt=80; state._last=now; update(dt); draw(); requestAnimationFrame(loop); }

  // ===== Flow =====
  function startGame(){ try{ if(!audioCtx) initAudio(); }catch(e){} startBGM('normal'); state.running=true; state._last=performance.now(); state.last=0; state.score=0; state.bullets.length=0; state.enemies.length=0; state.spawnAcc=0; state.explosions.length=0; state.items.length=0; state.boss=null; state.bossShots.length=0; state.freeze=false; state.clearTimer=0; state.clearShown=false; state.dieFreeze=false; state.dieTimer=0; state.dieShown=false; state.power={triple:false, rapid:false, shield:0}; scoreEl.textContent='SCORE 0000'; bossBadge.style.display='none'; initStars(); menu.style.display='none'; requestAnimationFrame(loop); }
  function triggerDeath(){ state.dieFreeze=true; state.dieTimer=2000; state.dieShown=false; }
  function showGameOverOverlay(){ stopBGM(); state.running=false; if(state.score>state.best){ state.best=state.score; localStorage.setItem('rs_best', String(state.best)); } bestEl.textContent='BEST '+String(state.best).padStart(4,'0'); var d=document.createElement('div'); d.className='overlay'; d.innerHTML='<div class="card"><h1>Game Over</h1><p style="color:#c7d2fe">Score: <strong>'+state.score+'</strong></p><button class="btn" id="againBtn">RETRY</button></div>'; document.body.appendChild(d); document.getElementById('againBtn').onclick=function(){ document.body.removeChild(d); startGame(); }; }
  function gameClear(x,y){ state.freeze=true; state.clearTimer=1000; state.clearShown=false; var cx=(typeof x==='number')?x:(state.boss?state.boss.x:innerWidth/2); var cy=(typeof y==='number')?y:(state.boss?state.boss.y:innerHeight*0.25); for(var i=0;i<6;i++) createExplosion(cx+rand(-20,20), cy+rand(-20,20), true); state.boss=null; bossBadge.style.display='none'; }
  function showClearOverlay(){ stopBGM(); state.running=false; if(state.score>state.best){ state.best=state.score; localStorage.setItem('rs_best', String(state.best)); } bestEl.textContent='BEST '+String(state.best).padStart(4,'0'); var d=document.createElement('div'); d.className='overlay'; d.innerHTML='<div class="card"><h1>🎉 GAME CLEAR!</h1><p style="color:#c7d2fe">ボスを撃破！<br>Score: <strong>'+state.score+'</strong></p><button class="btn" id="againBtn">PLAY AGAIN</button></div>'; document.body.appendChild(d); document.getElementById('againBtn').onclick=function(){ document.body.removeChild(d); startGame(); }; }

  // ===== START button (robust) =====
  var startBtn=document.getElementById('startBtn');
  function safeStart(e){ try{ e&&e.preventDefault&&e.preventDefault(); e&&e.stopPropagation&&e.stopPropagation(); }catch(_){} if(!audioCtx) initAudio(); unlockAudioOnce(); startGame(); }
  if(startBtn){ ['click','pointerdown','touchstart'].forEach(function(ev){ startBtn.addEventListener(ev, safeStart, {passive:false}); }); startBtn.onclick=safeStart; }
})();
</script>
