<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rocket Shooter – Debug Fixed (sfxShoot Defined)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP",sans-serif}
    canvas{width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:8px;pointer-events:none;z-index:10}
    .badge{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;border:1px solid rgba(255,255,255,.2)}
    .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:20}
    .card{background:rgba(30,30,40,.9);padding:20px;border-radius:16px;text-align:center}
    .btn{border:none;padding:12px 18px;border-radius:8px;font-size:16px;font-weight:bold;background:#5eead4;color:#111;margin-top:8px}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="badge" id="score">SCORE 0000</div>
    <div class="badge" id="best">BEST 0000</div>
  </div>
  <div class="overlay" id="menu"><div class="card"><h1>🚀 Rocket Shooter</h1><p>指でなぞって自機を操作！<br>タップで開始</p><button class="btn" id="startBtn">START</button></div></div>
<script>
(function(){
  const cv=document.getElementById('game');
  const ctx=cv.getContext('2d');
  let w,h,dpr;
  function resize(){dpr=window.devicePixelRatio||1;w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);} resize();
  window.addEventListener('resize',resize);

  // ====== audio ======
  const sfx={};
  function loadSfx(name,src,voices){sfx[name]={pool:[],idx:0};for(let i=0;i<voices;i++){const a=new Audio(src);a.preload='auto';sfx[name].pool.push(a);}}
  function playSfx(name,vol=0.8){if(!sfx[name])return;const a=sfx[name].pool[sfx[name].idx++%sfx[name].pool.length];try{a.pause();a.currentTime=0;a.volume=vol;a.play();}catch(e){}}
  function setupSfx(){loadSfx('shot','shot.mp3',5);loadSfx('bakuha','bakuha.mp3',5);}
  function sfxShoot(){playSfx('shot',0.8);}
  function sfxExplode(){playSfx('bakuha',0.9);}
  setupSfx();

  // ====== game state ======
  const state={running:false,score:0,best:0,player:{x:0.5,y:0.8,r:15,tx:0.5,ty:0.8},bullets:[],enemies:[],spawn:0};
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const menu=document.getElementById('menu');

  function spawnEnemy(){const x=Math.random()*w,y=-20;state.enemies.push({x,y,r:14,v:60+Math.random()*40});}

  function update(dt){
    const p=state.player;
    const s=1-Math.exp(-10*dt/1000);
    p.x+=(p.tx-p.x)*s; p.y+=(p.ty-p.y)*s;

    p.fire=(p.fire||0)+dt; while(p.fire>400){p.fire-=400;state.bullets.push({x:p.x*w,y:p.y*h-20,vy:-300});sfxShoot();}

    for(const b of state.bullets)b.y+=b.vy*dt/1000;
    state.bullets=state.bullets.filter(b=>b.y>-20);

    state.spawn+=dt; while(state.spawn>700){state.spawn-=700;spawnEnemy();}
    for(const e of state.enemies)e.y+=e.v*dt/1000;
    state.enemies=state.enemies.filter(e=>e.y<h+40);

    for(let i=state.enemies.length-1;i>=0;i--){const e=state.enemies[i];for(let j=state.bullets.length-1;j>=0;j--){const b=state.bullets[j];const dx=b.x*w-e.x,dy=b.y-e.y;if(dx*dx+dy*dy<e.r*e.r){state.enemies.splice(i,1);state.bullets.splice(j,1);state.score++;scoreEl.textContent='SCORE '+String(state.score).padStart(4,'0');sfxExplode();break;}}}
  }

  function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fde047';for(const b of state.bullets)ctx.fillRect(b.x*w-2,b.y-8,4,8);ctx.fillStyle='#9ca3af';for(const e of state.enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();}const px=state.player.x*w,py=state.player.y*h;ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.moveTo(px,py-20);ctx.lineTo(px-10,py+10);ctx.lineTo(px+10,py+10);ctx.closePath();ctx.fill();}

  function loop(t){if(!state.running)return;const now=performance.now();const dt=state.last?now-state.last:16;state.last=now;update(dt);draw();requestAnimationFrame(loop);}

  function startGame(){state.running=true;state.last=0;state.score=0;state.bullets=[];state.enemies=[];menu.style.display='none';requestAnimationFrame(loop);}

  function safeStart(e){e.preventDefault();e.stopPropagation();startGame();}
  document.getElementById('startBtn').addEventListener('click',safeStart);

  // pointer move
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();state.player.tx=(e.clientX-r.left)/r.width;state.player.ty=(e.clientY-r.top)/r.height;});
  cv.addEventListener('pointermove',e=>{if(e.pressure>0){const r=cv.getBoundingClientRect();state.player.tx=(e.clientX-r.left)/r.width;state.player.ty=(e.clientY-r.top)/r.height;}});
})();
</script>
</body>
</html>
