<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rocket Shooter – with Sound & UFO</title>
  <style>
    :root { --fg:#e2e8f0; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; height:100%; background:#0b1b3a; color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Hiragino Kaku Gothic ProN", Meiryo, "Noto Sans JP", sans-serif; }
    canvas{ width:100%; height:100%; display:block; }
    .hud{ position:fixed; top:env(safe-area-inset-top); left:0; right:0; display:flex; gap:8px; padding:8px 12px; pointer-events:none; }
    .badge{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); padding:6px 10px; border-radius:999px; font-variant-numeric:tabular-nums; box-shadow:0 2px 12px rgba(0,0,0,.25); }
    .overlay{ position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.45); }
    .card{ width:min(92vw,560px); border-radius:20px; padding:20px; background:rgba(14,18,30,.9); border:1px solid rgba(255,255,255,.15); box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .card h1{ margin:6px 0 12px; font-size: clamp(20px,5vw,28px); }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn{ pointer-events:auto; appearance:none; border:none; border-radius:14px; padding:12px 16px; font-size:16px; font-weight:700; color:#0b0f1a; background:#5eead4; box-shadow:0 4px 14px rgba(0,0,0,.25), inset 0 -2px 0 rgba(0,0,0,.25); }
    .hint{ position:fixed; left:0; right:0; bottom:env(safe-area-inset-bottom); color:#cbd5e1; text-align:center; padding:10px; font-size:12px; opacity:.8; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="badge" id="score">SCORE 0000</div>
    <div class="badge" id="best">BEST 0000</div>
  </div>
  <div class="hint">ドラッグでロケットを移動（オートショット）</div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>🚀 Rocket Shooter</h1>
      <p style="color:#c7d2fe">音楽と効果音付き。敵はグレーのUFO型、1発で撃破。</p>
      <ul style="margin:0 0 12px 1.2em; color:#c7d2fe; line-height:1.7">
        <li>指でドラッグ＝ロケット移動</li>
        <li>オートショット（毎秒8発）</li>
        <li>BGM＋弾発射音＋爆発音</li>
      </ul>
      <div class="row"><button class="btn" id="startBtn">START</button></div>
    </div>
  </div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const menu = document.getElementById('menu');
  const startBtn = document.getElementById('startBtn');

  // HiDPI
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  function resize(){ const w=innerWidth, h=innerHeight; cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);} window.addEventListener('resize', resize, {passive:true}); resize();

  const state={ running:false,last:performance.now(),score:0,best:parseInt(localStorage.getItem('rs_best')||'0',10),player:{x:0.5,y:0.82,r:18,fireAcc:0},bullets:[],enemies:[],spawnAcc:0 };
  bestEl.textContent='BEST '+String(state.best).padStart(4,'0');

  // Audio setup
  let audioCtx, masterGain;
  function initAudio(){
    if(audioCtx) return;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0.3; masterGain.connect(audioCtx.destination);
    playBGM();
  }
  function playTone(freq,dur=0.1,type='square',vol=0.3){
    if(!audioCtx) return;
    const osc=audioCtx.createOscillator(); const g=audioCtx.createGain();
    osc.type=type; osc.frequency.value=freq; g.gain.value=vol;
    osc.connect(g).connect(masterGain);
    const now=audioCtx.currentTime;
    g.gain.setValueAtTime(vol,now); g.gain.exponentialRampToValueAtTime(0.001,now+dur);
    osc.start(now); osc.stop(now+dur);
  }
  function sfxShoot(){ playTone(600,0.05,'square',0.2); }
  function sfxExplode(){ playTone(120,0.3,'sawtooth',0.3); playTone(60,0.2,'triangle',0.2); }
  function playBGM(){
    const tempo=140; const beat=60/tempo;
    for(let bar=0; bar<4; bar++){
      for(let i=0;i<8;i++){
        const n=[261.63,293.66,329.63,349.23][i%4];
        const t=audioCtx.currentTime+(bar*8+i)*beat*0.5;
        playTone(n/2,0.15,'triangle',0.05);
      }
    }
  }

  // Input
  let dragging=false;
  function setFromEvent(e){const t=e.touches?e.touches[0]:e;const rect=cv.getBoundingClientRect();const x=(t.clientX-rect.left)/rect.width;const y=(t.clientY-rect.top)/rect.height;state.player.x=Math.max(0.05,Math.min(0.95,x));state.player.y=Math.max(0.1,Math.min(0.95,y));}
  cv.addEventListener('pointerdown',e=>{dragging=true;setFromEvent(e);if(!audioCtx)initAudio();});
  cv.addEventListener('pointermove',e=>{if(dragging)setFromEvent(e);});
  addEventListener('pointerup',()=>dragging=false);
  addEventListener('pointercancel',()=>dragging=false);

  // Helpers
  function rand(a,b){return a+Math.random()*(b-a);}

  // Drawing
  function drawBG(){const w=innerWidth,h=innerHeight;const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0b1b3a');g.addColorStop(1,'#091226');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
  function drawRocket(x,y,r,t){ctx.save();ctx.translate(x,y);const fl=Math.sin(t*20)*2+6;ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(0,r+2);ctx.lineTo(-4,r+2+fl);ctx.lineTo(4,r+2+fl);ctx.closePath();ctx.fill();ctx.fillStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r*0.6,-r*0.1,r*0.55,r*0.75);ctx.lineTo(-r*0.55,r*0.75);ctx.quadraticCurveTo(-r*0.6,-r*0.1,0,-r);ctx.fill();ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(0,-r*0.2,r*0.35,0,Math.PI*2);ctx.fill();ctx.restore();}
  function drawUFO(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#9ca3af';ctx.beginPath();ctx.ellipse(0,0,e.r*1.5,e.r*0.6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6b7280';ctx.beginPath();ctx.ellipse(0,-e.r*0.3,e.r*0.8,e.r*0.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}

  // Logic
  function spawnEnemy(){const w=innerWidth;const x=rand(0.1,0.9)*w;state.enemies.push({x,y:-20,r:14,vy:rand(80,120)});}
  function update(dt){const w=innerWidth,h=innerHeight;state.player.fireAcc+=dt;const fireEvery=1000/8;while(state.player.fireAcc>=fireEvery){state.player.fireAcc-=fireEvery;state.bullets.push({x:state.player.x*w,y:state.player.y*h-state.player.r,vy:-360});sfxShoot();}for(const b of state.bullets){b.y+=b.vy*dt/1000;}state.bullets=state.bullets.filter(b=>b.y>-20);state.spawnAcc+=dt;const spawnEvery=700;while(state.spawnAcc>=spawnEvery){state.spawnAcc-=spawnEvery;spawnEnemy();}for(const e of state.enemies){e.y+=e.vy*dt/1000;}state.enemies=state.enemies.filter(e=>e.y<h+40);for(let i=state.enemies.length-1;i>=0;i--){const e=state.enemies[i];for(let j=state.bullets.length-1;j>=0;j--){const b=state.bullets[j];const dx=b.x-e.x,dy=b.y-e.y;if(dx*dx+dy*dy<=e.r*e.r){state.enemies.splice(i,1);state.bullets.splice(j,1);state.score++;scoreEl.textContent='SCORE '+String(state.score).padStart(4,'0');sfxExplode();break;}}}const px=state.player.x*w,py=state.player.y*h,pr=state.player.r;for(const e of state.enemies){const dx=px-e.x,dy=py-e.y;if(dx*dx+dy*dy<=(pr+e.r)*(pr+e.r)){endGame();return;}}}

  function draw(){drawBG();const w=innerWidth,h=innerHeight;ctx.globalAlpha=.08;ctx.strokeStyle='#ffffff';for(let y=0;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}for(let x=0;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}ctx.globalAlpha=1;const px=state.player.x*w,py=state.player.y*h;drawRocket(px,py,state.player.r,performance.now()/1000);ctx.fillStyle='#fde047';for(const b of state.bullets){ctx.fillRect(b.x-2,b.y-8,4,8);}for(const e of state.enemies){drawUFO(e);} }

  function loop(){if(!state.running)return;const now=performance.now();let dt=now-state.last;if(dt>80)dt=80;state.last=now;update(dt);draw();requestAnimationFrame(loop);}

  function startGame(){state.running=true;state.last=performance.now();state.score=0;scoreEl.textContent='SCORE 0000';state.bullets.length=0;state.enemies.length=0;state.spawnAcc=0;state.player.fireAcc=0;state.player.x=0.5;state.player.y=0.82;menu.style.display='none';requestAnimationFrame(loop);}
  function endGame(){state.running=false;if(state.score>state.best){state.best=state.score;localStorage.setItem('rs_best',String(state.best));}bestEl.textContent='BEST '+String(state.best).padStart(4,'0');const d=document.createElement('div');d.className='overlay';d.innerHTML=`<div class="card"><h1>Game Over</h1><p style="color:#c7d2fe">Score: <strong>${state.score}</strong></p><div class="row"><button class="btn" id="againBtn">RETRY</button></div></div>`;document.body.appendChild(d);document.getElementById('againBtn').onclick=()=>{document.body.removeChild(d);startGame();};}

  startBtn.addEventListener('click',()=>{if(!audioCtx)initAudio();startGame();});
})();
</script>
</body>
</html>
