<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Rocket Shooter – Starfield + Power-Ups (Stable)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#e2e8f0;font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP",sans-serif;overflow:hidden}
    canvas{width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;gap:8px;padding:8px 12px;pointer-events:none;z-index:5}
    .badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 10px;border-radius:999px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
    .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);z-index:10}
    .card{background:rgba(14,18,30,.9);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,.15);width:min(92vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .card h1{margin:6px 0 12px;font-size:clamp(20px,5vw,28px)}
    .btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;color:#0b0f1a;background:#5eead4;box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 -2px 0 rgba(0,0,0,.25)}
    .hint{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom);color:#cbd5e1;text-align:center;padding:10px;font-size:12px;opacity:.85;z-index:5}
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="badge" id="score">SCORE 0000</div>
    <div class="badge" id="best">BEST 0000</div>
    <div class="badge" id="bossBadge" style="display:none">BOSS 100</div>
  </div>
  <div class="hint">画面を指でなぞってロケットを移動（オートショット）</div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>🚀 Rocket Shooter</h1>
      <p>流れる星空の中を突き進め！<br>雑魚<strong>30機撃破</strong>で<strong>赤いUFOボス</strong>登場（<strong>高速・重低音BGM</strong>）。<br>アイテム：<strong>3</strong>(3方向) / <strong>V</strong>(2耐久バリア) / <strong>R</strong>(連射強化)</p>
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>

<script>
(function(){
  // ===== Self-tests (prevent silent DOM issues) =====
  (function(){var ids=['game','score','best','bossBadge','menu','startBtn'];var miss=ids.filter(function(i){return !document.getElementById(i)}); console.assert(miss.length===0,'Missing DOM:',miss);})();

  // ===== Canvas / DPR =====
  var cv=document.getElementById('game'), ctx=cv.getContext('2d');
  var dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){ var w=innerWidth, h=innerHeight; cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);} resize();
  addEventListener('resize', resize, {passive:true});

  // ===== Starfield (center-origin so it covers the whole screen) =====
  var stars=[]; function initStars(){ var N=160; stars.length=0; for(var i=0;i<N;i++){ stars.push({ x:(Math.random()*2-1)*(innerWidth/2), y:(Math.random()*2-1)*(innerHeight/2), z:Math.random()*innerWidth }); } }
  initStars();
  function drawStars(dt){ ctx.fillStyle='#000'; ctx.fillRect(0,0,innerWidth,innerHeight); var speed=0.24; for(var i=0;i<stars.length;i++){ var s=stars[i]; s.z-=dt*speed; if(s.z<=0){ s.z=innerWidth; s.x=(Math.random()*2-1)*(innerWidth/2); s.y=(Math.random()*2-1)*(innerHeight/2); } var k=128/s.z; var px=s.x*k+innerWidth/2; var py=s.y*k+innerHeight/2; if(px>=-2&&px<=innerWidth+2&&py>=-2&&py<=innerHeight+2){ var size=(1-s.z/innerWidth)*2.5+0.5; ctx.fillStyle='#fff'; ctx.fillRect(px,py,size,size); } } }

  // ===== State =====
  var state={ running:false,last:0,score:0,best:parseInt(localStorage.getItem('rs_best')||'0',10),
    player:{x:0.5,y:0.82,tx:0.5,ty:0.82,r:18,fireAcc:0,fireRate:250}, // 250ms 基本（以前の半分の速さ = 連射遅く）
    bullets:[], enemies:[], spawnAcc:0, explosions:[], items:[],
    boss:null, bossShots:[],
    // FX freezes
    freeze:false, clearTimer:0, clearShown:false, // win
    dieFreeze:false, dieTimer:0, dieShown:false,  // death (2s)
    power:{triple:false, rapid:false, shield:0}
  };
  var scoreEl=document.getElementById('score');
  var bestEl=document.getElementById('best'); bestEl.textContent='BEST '+String(state.best).padStart(4,'0');
  var bossBadge=document.getElementById('bossBadge');
  var menu=document.getElementById('menu');

  // ===== Audio =====
  var audioCtx=null, masterGain=null, bgmTimerId=null, currentBgm='none';
  function initAudio(){ try{ if(audioCtx) return; audioCtx=new (window.AudioContext||window.webkitAudioContext)(); masterGain=audioCtx.createGain(); masterGain.gain.value=0.32; masterGain.connect(audioCtx.destination); if(audioCtx.state==='suspended' && audioCtx.resume) audioCtx.resume(); }catch(e){ console.warn(e); }}
  function tone(freq,dur,type,vol,when){ if(!audioCtx) return; try{ var osc=audioCtx.createOscillator(); var g=audioCtx.createGain(); osc.type=type; osc.frequency.value=freq; g.gain.value=vol; osc.connect(g).connect(masterGain); var t=when||audioCtx.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); osc.start(t); osc.stop(t+dur); }catch(e){} }
  function stopBGM(){ if(bgmTimerId){ clearTimeout(bgmTimerId); bgmTimerId=null; } }
  function startBGM(mode){ if(!audioCtx) return; try{ audioCtx.resume&&audioCtx.resume(); }catch(_){} stopBGM(); currentBgm=mode||'normal'; var tempo=(currentBgm==='boss')?220:180; var beat=60/tempo; var chords=(currentBgm==='boss')? [[110,147,220],[98,130,196],[123,164,220],[147,196,247]] : [[262,330,392],[220,294,392],[247,330,415],[220,294,392]]; function loop(){ if(!audioCtx) return; var now=audioCtx.currentTime+0.05; for(var bar=0; bar<4; bar++){ var t0=now+bar*4*beat, ch=chords[bar%4]; for(var s=0;s<4;s++){ tone(55,0.06,'square',0.13, t0 + s*beat); } tone(ch[0]/2,0.18,'triangle',0.10, t0); tone(ch[0]/2,0.18,'triangle',0.10, t0+2*beat); for(var hh=0; hh<8; hh++){ tone(9000,0.02,'square',0.03, t0 + hh*(beat/2)); } for(var i=0;i<16;i++){ var f=ch[i%3]*(currentBgm==='boss'?2.8:2.2); tone(f,0.09,'square', currentBgm==='boss'?0.085:0.06, t0 + i*(beat/4)); } } bgmTimerId=setTimeout(loop, (16*beat*1000)|0); } loop(); }
  function sfxShoot(){ if(!audioCtx) return; tone(700,0.05,'square',0.18,audioCtx.currentTime); }
  function sfxExplode(){ if(!audioCtx) return; var t=audioCtx.currentTime; tone(120,0.25,'sawtooth',0.3,t); tone(60,0.20,'triangle',0.25,t+0.03); }

  // ===== Assets (Boss image) =====
  var bossImg=new Image(); var bossReady=false; bossImg.onload=function(){ bossReady=true; }; bossImg.src='boss.png'; // ← 画像ファイルを index.html と同じ場所に置いてください

  // ===== Assets (Player image) =====
  var playerImg=new Image(); var playerReady=false; playerImg.onload=function(){ playerReady=true; }; playerImg.src='player.png'; // ← 自機画像を player.png という名前で同階層へ

  // ===== Input: finger-follow =====
  var dragging=false;
  function setTargetFromEvent(e){ var t=e.touches?e.touches[0]:e; var r=cv.getBoundingClientRect(); var nx=(t.clientX-r.left)/r.width; var ny=(t.clientY-r.top)/r.height; state.player.tx=Math.max(0.05,Math.min(0.95,nx)); state.player.ty=Math.max(0.10,Math.min(0.95,ny)); }
  cv.addEventListener('pointerdown', function(e){ dragging=true; setTargetFromEvent(e); if(!audioCtx) initAudio(); });
  cv.addEventListener('pointermove', function(e){ if(dragging) setTargetFromEvent(e); });
  addEventListener('pointerup', function(){ dragging=false; });
  cv.addEventListener('touchstart', function(e){ dragging=true; setTargetFromEvent(e); if(!audioCtx) initAudio(); }, {passive:false});
  cv.addEventListener('touchmove', function(e){ if(dragging) setTargetFromEvent(e); }, {passive:false});
  cv.addEventListener('touchend', function(){ dragging=false; });
  cv.addEventListener('touchcancel', function(){ dragging=false; });

  // ===== Helpers / Drawing =====
  function rand(a,b){ return a+Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function drawPlayer(){ var x=state.player.x*innerWidth, y=state.player.y*innerHeight; var r=state.player.r; if(playerReady){ var aspect=playerImg.width && playerImg.height ? (playerImg.width/playerImg.height) : 1; var h=Math.min(innerHeight, innerWidth)*0.1; var w=h*aspect; // 画面サイズに追従
      ctx.save(); ctx.translate(x,y); ctx.drawImage(playerImg, -w/2, -h/2, w, h); if(state.power.shield>0){ ctx.strokeStyle='rgba(147,197,253,0.6)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,Math.max(w,h)*0.6,0,Math.PI*2); ctx.stroke(); } ctx.restore();
    } else {
      // フォールバック：従来のロケット
      ctx.save(); ctx.translate(x,y); var fl=Math.sin(performance.now()/50)*2+6; ctx.fillStyle='#f97316'; ctx.beginPath(); ctx.moveTo(0,r+2); ctx.lineTo(-4,r+2+fl); ctx.lineTo(4,r+2+fl); ctx.closePath(); ctx.fill(); ctx.fillStyle='#e5e7eb'; ctx.beginPath(); ctx.moveTo(0,-r); ctx.quadraticCurveTo(r*0.6,-r*0.1,r*0.55,r*0.75); ctx.lineTo(-r*0.55,r*0.75); ctx.quadraticCurveTo(-r*0.6,-r*0.1,0,-r); ctx.fill(); ctx.fillStyle='#38bdf8'; ctx.beginPath(); ctx.arc(0,-r*0.2,r*0.35,0,Math.PI*2); ctx.fill(); if(state.power.shield>0){ ctx.strokeStyle='rgba(147,197,253,0.6)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.stroke(); } ctx.restore(); }
  }
  function drawUFO(e){ ctx.save(); ctx.translate(e.x,e.y); ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.ellipse(0,0,e.r*1.5,e.r*0.6,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.ellipse(0,-e.r*0.3,e.r*0.8,e.r*0.5,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  function drawBoss(B){ ctx.save(); ctx.translate(B.x,B.y); if(bossReady){ ctx.drawImage(bossImg, -B.w/2, -B.h/2, B.w, B.h); } else { // fallback: 赤UFO
      ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.ellipse(0,0,B.w*0.45,B.h*0.25,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fecaca'; ctx.beginPath(); ctx.ellipse(0,-B.h*0.18,B.w*0.18,B.h*0.18,0,0,Math.PI*2); ctx.fill(); }
    ctx.restore(); }
  function drawItem(it){ ctx.save(); ctx.translate(it.x,it.y); ctx.fillStyle='#fef08a'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#0b0f1a'; ctx.font='700 14px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(it.type,0,1); ctx.restore(); }
  function createExplosion(x,y,strong){ var n=strong?40:18, parts=[]; for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2, sp=rand(80, strong?320:240); parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:i%2?'#fde047':'#f97316'});} state.explosions.push({parts:parts,age:0,life: strong?700:500}); }

  // ===== Spawners =====
  function spawnEnemy(){ state.enemies.push({x:rand(0.1,0.9)*innerWidth,y:-20,r:14,vy:rand(80,120)}); }
  function maybeSpawnItem(x,y){ if(Math.random()<0.1){ var types=['3','V','R']; var t=types[(Math.random()*3)|0]; state.items.push({x:x,y:y,type:t,vy:80}); } }

  // ===== Update =====
  function update(dt){
    // Win freeze (celebration)
    if(state.freeze && state.clearTimer>0){ state.clearTimer-=dt; updateExplosions(dt); if(state.clearTimer<=0 && !state.clearShown){ state.clearShown=true; showClearOverlay(); } return; }
    // Death freeze (2s)
    if(state.dieFreeze && state.dieTimer>0){ state.dieTimer-=dt; updateExplosions(dt); if(state.dieTimer<=0 && !state.dieShown){ state.dieShown=true; showGameOverOverlay(); } return; }

    // smooth follow
    var s=1-Math.exp(-10*dt/1000); state.player.x += (state.player.tx-state.player.x)*s; state.player.y += (state.player.ty-state.player.y)*s; state.player.x=clamp(state.player.x,0.05,0.95); state.player.y=clamp(state.player.y,0.10,0.95);

    // shooting (base 250ms; rapid halves it)
    state.player.fireAcc += dt; var rate = state.power.rapid ? state.player.fireRate/2 : state.player.fireRate; while(state.player.fireAcc>=rate){ state.player.fireAcc-=rate; var px=state.player.x*innerWidth, py=state.player.y*innerHeight - state.player.r; if(audioCtx) sfxShoot(); if(state.power.triple){ var spread=[-0.15,0,0.15]; for(var i=0;i<spread.length;i++){ var ang=spread[i]; state.bullets.push({x:px,y:py,vx:400*Math.sin(ang),vy:-400*Math.cos(ang)}); } } else { state.bullets.push({x:px,y:py,vx:0,vy:-400}); } }

    // bullets
    for(var i=state.bullets.length-1;i>=0;i--){ var b=state.bullets[i]; b.x+=b.vx*dt/1000; b.y+=b.vy*dt/1000; if(b.y<-30||b.y>innerHeight+30||b.x<-30||b.x>innerWidth+30) state.bullets.splice(i,1); }

    // enemies
    state.spawnAcc += dt; while(state.spawnAcc>=700){ state.spawnAcc-=700; spawnEnemy(); }
    for(var e=0;e<state.enemies.length;e++){ state.enemies[e].y += state.enemies[e].vy*dt/1000; }
    state.enemies = state.enemies.filter(function(e){ return e.y<innerHeight+40; });

    // bullet -> enemy
    outer: for(var ei=state.enemies.length-1; ei>=0; ei--){ var E=state.enemies[ei]; for(var bj=state.bullets.length-1; bj>=0; bj--){ var BB=state.bullets[bj]; var dx=BB.x-E.x, dy=BB.y-E.y; if(dx*dx+dy*dy <= E.r*E.r){ state.enemies.splice(ei,1); state.bullets.splice(bj,1); state.score++; scoreEl.textContent='SCORE '+String(state.score).padStart(4,'0'); if(audioCtx) sfxExplode(); createExplosion(E.x,E.y,false); maybeSpawnItem(E.x,E.y); break outer; } } }

    // boss spawn at 30 kills
    if(!state.boss && state.score>=30){
      var aspect = (bossReady && bossImg.height) ? (bossImg.width / bossImg.height) : 0.5; // width/height
      var bh = Math.min(innerHeight * 0.55, 700); // 高さ優先
      var bw = Math.max(120, bh * aspect);
      var maxAmp = Math.max(40, (innerWidth - bw)/2 - 16);
      var amp = Math.min(maxAmp, Math.max(60, innerWidth*0.12));
      state.boss={x:innerWidth/2,y:innerHeight*0.22,w:bw,h:bh,hp:100,t:0,cx:innerWidth/2,amp:amp,fireAcc:0};
      bossBadge.style.display='inline-block'; bossBadge.textContent='BOSS '+state.boss.hp; if(audioCtx) startBGM('boss'); }

    // boss
    if(state.boss){ var B=state.boss; B.t += dt/1000; var margin=12; B.x = Math.max(B.w*0.5+12, Math.min(innerWidth-B.w*0.5-12, B.cx + B.amp*Math.sin(B.t*1.6)));
      // fire: every 300ms triple shot with slight spread
      B.fireAcc += dt; while(B.fireAcc>=300){ B.fireAcc-=300; var px2=state.player.x*innerWidth, py2=state.player.y*innerHeight; var sx=B.x, sy=B.y+B.h*0.1; var base=Math.atan2(py2-sy,px2-sx); var speed=300; for(var n=-1;n<=1;n++){ var a=base + n*0.1; state.bossShots.push({x:sx,y:sy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:4}); } }
      // hits
      for(var k=state.bullets.length-1;k>=0;k--){ var sb=state.bullets[k]; if(sb.x>=B.x-B.w/2 && sb.x<=B.x+B.w/2 && sb.y>=B.y-B.h/2 && sb.y<=B.y+B.h/2){ state.bullets.splice(k,1); if(B.hp>0){ B.hp--; bossBadge.textContent='BOSS '+B.hp; if(audioCtx) sfxExplode(); createExplosion(sb.x,sb.y,true); if(B.hp<=0){ bossBadge.style.display='none'; for(var t=0;t<10;t++){ createExplosion(B.x+rand(-30,30), B.y+rand(-20,20), true); } return gameClear(B.x,B.y); } } } }
      // player collide with boss
      var pxp=state.player.x*innerWidth, pyp=state.player.y*innerHeight, pr=state.player.r; var inX = pxp+pr > B.x-B.w/2 && pxp-pr < B.x+B.w/2; var inY = pyp+pr > B.y-B.h/2 && pyp-pr < B.y+B.h/2; if(inX && inY){ if(state.power.shield>0){ state.power.shield--; } else { if(audioCtx) sfxExplode(); createExplosion(pxp,pyp,true); return triggerDeath(); } }
    }

    // boss shots
    if(state.bossShots.length){ var psx=state.player.x*innerWidth, psy=state.player.y*innerHeight, pr2=state.player.r; for(var bs=state.bossShots.length-1; bs>=0; bs--){ var sh=state.bossShots[bs]; sh.x+=sh.vx*dt/1000; sh.y+=sh.vy*dt/1000; if(sh.x<-20||sh.x>innerWidth+20||sh.y<-40||sh.y>innerHeight+40){ state.bossShots.splice(bs,1); continue; } var dxs=psx-sh.x, dys=psy-sh.y; if(dxs*dxs + dys*dys <= (pr2+sh.r)*(pr2+sh.r)){ if(state.power.shield>0){ state.power.shield--; state.bossShots.splice(bs,1); continue; } if(audioCtx) sfxExplode(); createExplosion(psx,psy,true); return triggerDeath(); } } }

    // enemy collide with player
    var pxe=state.player.x*innerWidth, pye=state.player.y*innerHeight, pre=state.player.r; for(var m=state.enemies.length-1;m>=0;m--){ var e2=state.enemies[m]; var dxe=pxe-e2.x, dye=pye-e2.y; if(dxe*dxe + dye*dye <= (pre+e2.r)*(pre+e2.r)){ if(state.power.shield>0){ state.power.shield--; state.enemies.splice(m,1); continue; } if(audioCtx) sfxExplode(); createExplosion(pxe,pye,true); return triggerDeath(); } }

    // items update & pickup
    for(var it=state.items.length-1; it>=0; it--){ var I=state.items[it]; I.y += I.vy*dt/1000; if(I.y>innerHeight+20){ state.items.splice(it,1); continue; } if(Math.abs(I.x - pxe)<20 && Math.abs(I.y - pye)<20){ var ttype=I.type; state.items.splice(it,1); if(ttype==='3') state.power.triple=true; else if(ttype==='V') state.power.shield=2; else if(ttype==='R') state.power.rapid=true; } }

    // explosions
    updateExplosions(dt);
  }

  function updateExplosions(dt){ for(var q=state.explosions.length-1;q>=0;q--){ var ex=state.explosions[q]; ex.age+=dt; var damp=0.98; for(var p=0;p<ex.parts.length;p++){ var part=ex.parts[p]; part.x += part.vx*dt/1000; part.y += part.vy*dt/1000; part.vx *= damp; part.vy *= damp; part.vy += 80*dt/1000; } if(ex.age> (ex.life||600) ){ state.explosions.splice(q,1); } } }

  // ===== Draw =====
  function draw(){ var now=performance.now(); var dt=(state.last? now-state.last : 16); state.last=now; drawStars(dt); // starfield first
    // enemies
    for(var i=0;i<state.enemies.length;i++) drawUFO(state.enemies[i]);
    // boss
    if(state.boss) drawBoss(state.boss);
    // bullets
    ctx.fillStyle='#fde047'; for(var b=0;b<state.bullets.length;b++){ var bb=state.bullets[b]; ctx.fillRect(bb.x-2,bb.y-8,4,8); }
    // boss shots
    ctx.fillStyle='#ef4444'; for(var s=0;s<state.bossShots.length;s++){ var sh=state.bossShots[s]; ctx.beginPath(); ctx.arc(sh.x,sh.y,sh.r,0,Math.PI*2); ctx.fill(); }
    // items
    for(var it=0; it<state.items.length; it++) drawItem(state.items[it]);
    // player
    drawPlayer();
    // explosions
    for(var e=0; e<state.explosions.length; e++){ var ex=state.explosions[e]; for(var p=0;p<ex.parts.length;p++){ var part=ex.parts[p]; ctx.fillStyle=part.color; ctx.fillRect(part.x-1,part.y-1,2,2); } }
  }

  // ===== Loop =====
  function loop(){ if(!state.running) return; var now=performance.now(); var dt=state._last? (now-state._last):16; if(dt>80) dt=80; state._last=now; update(dt); draw(); requestAnimationFrame(loop); }

  // ===== Flow =====
  function startGame(){ try{ if(!audioCtx) initAudio(); }catch(e){} if(audioCtx) startBGM('normal'); state.running=true; state._last=performance.now(); state.last=0; state.score=0; state.bullets.length=0; state.enemies.length=0; state.spawnAcc=0; state.explosions.length=0; state.items.length=0; state.boss=null; state.bossShots.length=0; state.freeze=false; state.clearTimer=0; state.clearShown=false; state.dieFreeze=false; state.dieTimer=0; state.dieShown=false; state.power={triple:false, rapid:false, shield:0}; scoreEl.textContent='SCORE 0000'; bossBadge.style.display='none'; initStars(); menu.style.display='none'; requestAnimationFrame(loop); }
  function triggerDeath(){ state.dieFreeze=true; state.dieTimer=2000; state.dieShown=false; }
  function showGameOverOverlay(){ stopBGM(); state.running=false; if(state.score>state.best){ state.best=state.score; localStorage.setItem('rs_best', String(state.best)); } bestEl.textContent='BEST '+String(state.best).padStart(4,'0'); var d=document.createElement('div'); d.className='overlay'; d.innerHTML='<div class="card"><h1>Game Over</h1><p style="color:#c7d2fe">Score: <strong>'+state.score+'</strong></p><button class="btn" id="againBtn">RETRY</button></div>'; document.body.appendChild(d); document.getElementById('againBtn').onclick=function(){ document.body.removeChild(d); startGame(); }; }
  function gameClear(x,y){ state.freeze=true; state.clearTimer=1000; state.clearShown=false; var cx=(typeof x==='number')?x:(state.boss?state.boss.x:innerWidth/2); var cy=(typeof y==='number')?y:(state.boss?state.boss.y:innerHeight*0.25); for(var i=0;i<6;i++) createExplosion(cx+rand(-20,20), cy+rand(-20,20), true); state.boss=null; bossBadge.style.display='none'; }
  function showClearOverlay(){ stopBGM(); state.running=false; if(state.score>state.best){ state.best=state.score; localStorage.setItem('rs_best', String(state.best)); } bestEl.textContent='BEST '+String(state.best).padStart(4,'0'); var d=document.createElement('div'); d.className='overlay'; d.innerHTML='<div class="card"><h1>🎉 GAME CLEAR!</h1><p style="color:#c7d2fe">赤いUFOを撃破！<br>Score: <strong>'+state.score+'</strong></p><button class="btn" id="againBtn">PLAY AGAIN</button></div>'; document.body.appendChild(d); document.getElementById('againBtn').onclick=function(){ document.body.removeChild(d); startGame(); }; }

  // ===== START button (robust) =====
  var startBtn=document.getElementById('startBtn');
  function safeStart(e){ try{ e&&e.preventDefault&&e.preventDefault(); e&&e.stopPropagation&&e.stopPropagation(); }catch(_){} if(!audioCtx) initAudio(); startGame(); }
  if(startBtn){ ['click','pointerdown','touchstart'].forEach(function(ev){ startBtn.addEventListener(ev, safeStart, {passive:false}); }); startBtn.onclick=safeStart; }
})();
</script>
